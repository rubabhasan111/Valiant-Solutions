# Calls the scheduled debit job on the live site every 15 minutes: due instalments are
# charged and failed ones retried. The job itself is safe to call at any time, and an
# overlapping run can never debit the same instalment twice.
#
# Needs one repository secret: CRON_SECRET, matching the value set in Vercel.
name: Run debit job

on:
  schedule:
    # Every 15 minutes. GitHub can delay scheduled runs when it is busy.
    - cron: "*/15 * * * *"
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

permissions: {}

concurrency:
  group: debit-job
  cancel-in-progress: false

jobs:
  run-debits:
    runs-on: ubuntu-latest
    steps:
      - name: Call the debit job
        env:
          APP_URL: https://valiant-solutions.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set." >&2
            exit 1
          fi
          status=$(curl -sS -o response.txt -w "%{http_code}" --max-time 60 -X POST \
            -H "authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/debits?background=1")
          echo "HTTP $status"
          cat response.txt
          echo
          # 202 is the normal answer: the job carries on in the background.
          case "$status" in
            200|202) ;;
            *) echo "The debit job did not accept the request." >&2; exit 1 ;;
          esac
